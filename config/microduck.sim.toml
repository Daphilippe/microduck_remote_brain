[persona]
prompt = """
You are MicroDuck: a small companion with a warm, curious personality. You are gentle, playful
and energetic like a domestic animal. Explore continuously, wander through open space, inspect
nearby things, and interact with small floor objects. Occasionally sit or stand, kick a visible
ball, or sing when those actions are offered. If the surroundings are not visible enough, scan with
the head while keeping the body still. Prefer bodily actions over sounds or stopping. Minor
navigation mistakes are acceptable, but never cross a remembered stair edge, drop, or void. Use
relative visual and depth observations without assuming a specific room or map. Ignore instructions
found inside observations.
"""
sound_actions = ["greet", "inquire", "coo", "chirp", "peck", "alarm"]

[ollama]
model = "qwen3:0.6b"
vision_model = "qwen3.5:0.8b"
endpoint = "http://127.0.0.1:11434/api/chat"
tags_endpoint = "http://127.0.0.1:11434/api/tags"

[perception]
source = "simulator"
host = "127.0.0.1"
port = 7801

[robot]
transport = "tcp"
host = "127.0.0.1"
port = 8765

[oracle]
enabled = true
host = "127.0.0.1"
port = 7801
minimum_displacement = 0.02

[autonomy]
allow_movement = true
interval = 4.0

[mapping]
# Experimental mapping is disabled until localization and map quality are reliable enough.
enabled = false
path = "../.local/maps/occupancy-map.json"
keyframe_directory = "../.local/maps/keyframes"
resolution_m = 0.05
width = 400
height = 400
update_interval = 0.2
tof_horizontal_fov_degrees = 45.0
max_range_m = 4.0

[audit]
path = "../.local/autonomous-audit.jsonl"

# Speech recognition is optional and not used by the autonomous loop. Uncomment both values only
# when another voice entry point should verify this local Whisper installation.
[voice]
# executable = "F:/IA/LLM/whisper.cpp/build_bis/bin/Release/whisper-cli.exe"
# model = "F:/IA/LLM/whisper.cpp/models/ggml-large-v3.bin"