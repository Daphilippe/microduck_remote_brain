name: Quality

on:
  push:
    paths:
      - "microduck_remote_brain/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "microduck_remote_brain/**"
      - ".github/workflows/quality.yml"

defaults:
  run:
    working-directory: microduck_remote_brain

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run pylint src/microduck_remote_brain